services:
  - type: web
    name: glot-dictation-pipeline
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 -b 0.0.0.0:$PORT --timeout 120 webapp.app:app
    envVars:
      - key: WHISPER_MODEL
        value: tiny
      - key: WHISPER_BEAM_SIZE
        value: "1"
